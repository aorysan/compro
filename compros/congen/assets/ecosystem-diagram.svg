<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" fill="none">
  <defs>
    <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006D79"/>
      <stop offset="100%" stop-color="#009BAD"/>
    </linearGradient>
    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#009BAD" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#009BAD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Orbit Rings -->
  <circle cx="480" cy="260" r="225" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="480" cy="260" r="180" fill="url(#orbitGlow)" stroke="#009BAD" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="480" cy="260" r="125" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Connecting Lines -->
  
    <line x1="480" y1="260" x2="480" y2="80" stroke="#009BAD" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="480" cy="80" r="4" fill="#009BAD" />
  
    <line x1="480" y1="260" x2="636" y2="170" stroke="#009BAD" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="636" cy="170" r="4" fill="#009BAD" />
  
    <line x1="480" y1="260" x2="636" y2="350" stroke="#009BAD" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="636" cy="350" r="4" fill="#009BAD" />
  
    <line x1="480" y1="260" x2="480" y2="440" stroke="#009BAD" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="480" cy="440" r="4" fill="#009BAD" />
  
    <line x1="480" y1="260" x2="324" y2="350" stroke="#009BAD" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="324" cy="350" r="4" fill="#009BAD" />
  
    <line x1="480" y1="260" x2="324" y2="170" stroke="#009BAD" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="324" cy="170" r="4" fill="#009BAD" />
  

  <!-- Center Hub Platform -->
  <g class="center-hub-group">
    <!-- Ambient Pulse Glow -->
    <circle cx="480" cy="260" r="92" fill="#009BAD" fill-opacity="0.2" filter="url(#hubGlow)"/>
    <circle cx="480" cy="260" r="78" fill="url(#hubGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" filter="url(#nodeShadow)"/>
    
    <!-- Central Icon/Symbol -->
    <g transform="translate(464, 212)" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"/>
      <polyline points="2 17 12 22 22 17"/>
      <polyline points="2 12 12 17 22 12"/>
    </g>

    <!-- Hub Titles -->
    <text x="480" y="256" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="-0.02em">Venturo Pro</text>
    <text x="480" y="276" text-anchor="middle" fill="#ffffff" fill-opacity="0.9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Ecosystem Hub</text>
    <rect x="436" y="286" width="88" height="18" rx="9" fill="#000000" fill-opacity="0.35"/>
    <text x="480" y="298" text-anchor="middle" fill="#5eead4" font-family="'Inter', sans-serif" font-size="9" font-weight="700">100% TERINTEGRASI</text>
  </g>

