<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{BRAND}} — Company Profile</title>
<link rel="stylesheet" href="core.css">                <!-- IDENTITAS (warna dari logo, font, chrome, animasi) -->
<link rel="stylesheet" href="layouts/split-photo.css"> <!-- layout(s) yang dipakai -->
<link rel="stylesheet" href="deck.css">                <!-- struktur + navigasi (WAJIB) -->
<style>
  /* Override tema brand (dari logo): */
  /* :root{--cyan:#..;--blue:#..;--navy:#..} */
  /* Layout khusus per-slide di-scope #sN {…} — variasikan tiap slide (lihat SKILL katalog). */
</style>
</head>
<body class="deck">

<!-- ===== SLIDE 1 ===== (arketipe A: split-photo) -->
<section class="slide active" id="s1"><div class="wrap"><div class="stage">
  <div class="bar"></div>
  <div class="panelbg"></div>
  <div class="photo"><img src="assets/hero.jpg" alt=""><div class="tint"></div><div class="shade"></div></div>
  <div class="content">
    <div class="brand"><img src="assets/logo.png" alt="{{BRAND}}"></div>
    <div class="eyebrow"><span class="tick"></span><span>{{EYEBROW}}</span></div>
    <h1><span>{{JUDUL 1}}</span><span>{{JUDUL 2}} <em>{{AKSEN}}</em></span></h1>
    <p class="sub">{{SUBJUDUL}}</p>
    <div class="feat">{{A}}&nbsp;&nbsp;<u>·</u>&nbsp;&nbsp;{{B}}&nbsp;&nbsp;<u>·</u>&nbsp;&nbsp;{{C}}</div>
  </div>
  <div class="footer"><img src="assets/logo-white.png" alt="{{BRAND}}"><span>{{FOOTER}}</span><span class="no">01</span></div>
</div></div></section>

<!-- ===== SLIDE 2 ===== (GANTI arketipe biar tidak monoton) -->
<!-- ...duplikat pola di atas, ubah id="s2", layout & konten... -->

<!-- ===== NAVIGASI (jangan dihapus) ===== -->
<div class="zone zone-prev" id="zprev"><svg viewBox="0 0 24 44"><path d="M17 4 7 22l10 18"/></svg></div>
<div class="zone zone-next" id="znext"><svg viewBox="0 0 24 44"><path d="M7 4l10 18L7 40"/></svg></div>
<div class="mnav">
  <button id="mprev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="ct" id="mcount">1 / 1</span>
  <button id="mnext" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<script src="deck.js"></script>
</body>
</html>
